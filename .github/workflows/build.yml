name: Build AMX

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile PAWN script
        uses: pawn-lang/compiler@v1
        with:
          input: cases.pwn
          output: cases.amx

      - name: Upload compiled AMX
        uses: actions/upload-artifact@v4
        with:
          name: compiled-cases
          path: cases.amx
