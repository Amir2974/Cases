name: Build AMX
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Pawn
        run: |
          wget -qO- https://github.com | tar xz --strip-components=1
          mkdir -p include
          wget -q https://githubusercontent.com -O include/a_samp.inc
          wget -q https://githubusercontent.com -O include/core.inc
          wget -q https://githubusercontent.com -O include/float.inc
          wget -q https://githubusercontent.com -O include/string.inc
          wget -q https://githubusercontent.com -O include/file.inc
          wget -q https://githubusercontent.com -O include/time.inc
          wget -q https://githubusercontent.com -O include/datagram.inc
          iconv -f UTF-8 -t CP1251 cases.pwn > cases_win.pwn || cp cases.pwn cases_win.pwn
          LD_LIBRARY_PATH=./lib ./bin/pawncc cases_win.pwn -i./include -ocases.amx
      - uses: actions/upload-artifact@v4
        with:
          name: cases-amx
          path: cases.amx
